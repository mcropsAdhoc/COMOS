name: COMMOS Pilot Release

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: Target release environment
        required: true
        default: pilot
        type: choice
        options: [pilot, production]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mcropsadhoc/commos:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/mcropsadhoc/commos
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.release_environment }}
    steps:
      - name: Release summary
        run: |
          echo "COMMOS release candidate verified."
          echo "Target: ${{ inputs.release_environment }}"
          echo "Image: ghcr.io/mcropsadhoc/commos:${{ github.sha }}"
          echo "Railway deployment remains a controlled manual promotion until RAILWAY_TOKEN and protected environment approval are configured."
