name: COMMOS Industrial CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [hardening/industrial-v1]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commos
          POSTGRES_PASSWORD: commos
          POSTGRES_DB: commos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commos -d commos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://commos:commos@localhost:5432/commos_test
      COMMOS_AUTH_MODE: dev
      COMMOS_DEV_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      OIDC_AUDIENCE: commos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic check
      - run: |
          pip install pip-audit
          pip-audit

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: python}
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: commos:${{ github.sha }}
      - uses: anchore/scan-action@v6
        with:
          image: commos:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - uses: anchore/sbom-action@v0
        with:
          image: commos:${{ github.sha }}
          artifact-name: commos-sbom.spdx.json

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test policies -v
